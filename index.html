<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Senja Cafe</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<style>
        body {
            background-color: #fffaf3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #4b2e22;
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .judul {
            color: #4b2e22;
        }

        .carousel img {
            height: 400px;
            object-fit: cover;
        }

        .card img {
            height: 200px;
            object-fit: cover;
        }

        .card {
            border: none;
            box-shadow: 0 3px 10px #00000015;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-cafe {
            background-color: #7b4b2a;
            color: white;
        }

        .btn-cafe:hover {
            background-color: #4b2e22;
            color: white;
        }

        footer {
            background-color: #4b2e22;
            color: white;
        }

        /* Ukuran gambar untuk HP */
        @media (max-width: 576px) {
            .carousel img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#home">
           Azriel Malikul ihsan
        </a>
</body>
